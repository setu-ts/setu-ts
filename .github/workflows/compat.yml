name: Compatibility

# These jobs install the PUBLISHED packages from JSR's npm mirror — every
# dependency in `compat/package.json` is pinned at `latest`, and no lockfile is
# committed, because "resolving `latest` on every run is the point". They
# therefore test the REGISTRY, not the pull request: nothing a PR changes can
# affect their result until it has been released.
#
# Running them per-PR cost a Node install, a Bun install and two suites on every
# push while proving nothing about the diff. They run where they are meaningful
# instead:
#
#   * weekly, which is the drift the `latest` pins exist to catch — a new Node
#     or Bun release, or a transitive dependency that moved under a published
#     artifact;
#   * on demand, which is how a release is verified once the tag run has
#     published (`docs/releasing.md`);
#   * and on a change to the suite itself, where the diff IS the thing under
#     test.
on:
  schedule:
    # Mondays, 05:00 UTC — ahead of the working week and off the hour.
    - cron: '0 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'compat/**'
      - '.github/workflows/compat.yml'
  push:
    branches: [main]
    paths:
      - 'compat/**'
      - '.github/workflows/compat.yml'

permissions:
  contents: read

jobs:
  node-compat:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Node compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      # No lockfile is committed (see .gitignore): resolving `latest` on every
      # run is the point.
      - name: Install published packages
        run: npm install

      - name: Compat suite
        run: npm run test:node

  bun-compat:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Bun compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compat
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install published packages
        run: bun install

      - name: Compat suite
        run: bun run test:bun
