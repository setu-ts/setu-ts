name: Release

# Publishes the implemented workspace packages to JSR.
#
# Triggered by pushing a `v*` tag (e.g. `v0.1.0-alpha.1`), or manually via
# workflow_dispatch with `dry_run: true` to rehearse without uploading.
#
# JSR versions are IMMUTABLE: a published version can be yanked but never
# deleted or replaced. The gates below run before anything is uploaded.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate the publish without uploading'
        type: boolean
        default: true

permissions:
  # `write` for the "Create GitHub Release" step below, which is the only thing
  # here that writes to the repository. There is one job, so scoping it at the
  # job level would grant exactly the same token to the same steps.
  contents: write
  # Required for JSR's OIDC authentication and for provenance attestation.
  id-token: write

jobs:
  release:
    name: Publish to JSR
    runs-on: ubuntu-latest
    # The same backend environment as the `deno` job in ci.yml, because the
    # gates below re-run that job's suite and it is not the same suite without
    # them. GitHub sets CI=true in EVERY workflow, so `test/apps-gate.test.ts`
    # asserts REDIS_URL is reachable here exactly as it does on a pull request
    # — the assertion M53 added so dropping the variable could not silently
    # skip the three guarded Redis tests. Without these, that assertion fails
    # and the release job dies before publishing anything: it is what killed
    # the v0.1.0-alpha.5 run, which had to be published by hand.
    env:
      REDIS_URL: redis://localhost:6379
      SQS_ENDPOINT_URL: http://localhost:9324
      SQS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # M70c §3.7 real-outage suites (must match ci.yml — the release job
      # re-runs the same suite, and test/apps-gate.test.ts asserts the wiring
      # on both workflows).
      RABBITMQ_URL: amqp://localhost:5672
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: m70c-verify
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      SMTP_URL: smtp://localhost:1025
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticmq:
        image: softwaremill/elasticmq-native:1.7.1
        ports:
          - 9324:9324
        # The image ships neither curl nor a 2xx-answering root path — ElasticMQ
        # returns 400 to a bare GET / — so an HTTP probe can never pass. `nc` is
        # present and a port check is what readiness actually means here.
        options: >-
          --health-cmd "nc -z localhost 9324 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # M70c §3.7: same three real-outage services as ci.yml — the release job
      # re-runs the suite, so the backend environment must agree exactly.
      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      minio:
        # `edge-cicd` is MinIO's purpose-built CI image: it starts the server
        # with NO command. That matters because a GitHub Actions service
        # container accepts only image/credentials/env/ports/volumes/options —
        # there is no `command` (or `environment`) key, and the stock RELEASE
        # image prints its usage and exits when started without `server /data`.
        image: minio/minio:edge-cicd
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.20.4
        ports:
          - 1025:1025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # actions/checkout writes the job token into the local git config by
          # default, so every step after it can push. This job now requests
          # `contents: write` for the release step at the very end, and nothing
          # here does a networked git operation — the suite's only git call is a
          # local `git ls-files` — so the gates and the publish run with no
          # write-capable credential in reach. The release step gets its token
          # explicitly through GH_TOKEN instead.
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5

      # ── Gates ────────────────────────────────────────────────────────────
      # Same four gates as CI, re-run here so a tag can never publish a tree
      # that would have failed on a pull request.
      - name: Format check
        run: deno task fmt:check

      - name: Lint
        run: deno task lint

      - name: Type check
        run: deno task check

      - name: Test with coverage
        run: deno task test:coverage

      # ── Consistency ──────────────────────────────────────────────────────
      # The tag and the package versions must agree, or the release notes
      # would describe versions nobody can install.
      - name: Verify tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: deno run --allow-read scripts/verify-release.ts "${GITHUB_REF_NAME#v}"

      # ── Publish ──────────────────────────────────────────────────────────
      # Published one package at a time from an explicit list, NOT with a
      # workspace-wide `deno publish`: the workspace also contains the three
      # starter stubs, which export nothing and must not reach JSR.
      #
      # The list is ordered so a dependency is always published before its
      # dependents (common → kernel/runtime → everything else). JSR rejects a
      # package whose dependency version does not yet exist.
      #
      # PREREQUISITE: every package must already EXIST on JSR. Creating the
      # scope is not enough, and `deno publish` cannot create packages without
      # a terminal — it fails with "Following packages don't exist" and a
      # creation link each. Run `deno task release:create-packages` once (see
      # docs/releasing.md); after that this job is self-sufficient.
      #
      # No JSR_TOKEN here: the runner's OIDC identity authenticates, which is
      # why `id-token: write` is requested above.
      # Invoked through the deno task, NOT as an inlined `deno run`. The task
      # already carries the right permission set; the workflow used to duplicate
      # it and the duplicate drifted, omitting --allow-env and --allow-net, so
      # this step failed for three consecutive releases. One definition, one
      # place to keep correct.
      - name: Publish
        run: |
          deno task release:publish \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      # ── Release object ───────────────────────────────────────────────────
      # LAST, and deliberately so: a failure here must not cost the publish.
      # If this step goes red the packages are already live on JSR — do NOT
      # re-run the job, because JSR versions are immutable and the publish
      # would fail on every package. Create the object by hand instead:
      #   deno run --allow-read scripts/release-notes.ts <version> > notes.md
      #   gh release create v<version> --notes-file notes.md --prerelease
      #
      # Tags before v0.1.0-alpha.8 carry no Release object by decision and are
      # not backfilled; alpha.8's was created by hand, and this step is what
      # makes alpha.9 onward automatic.
      #
      # The notes come from a tested script, not from inlined shell — see that
      # file's header, and the Publish step's comment above for what a drifting
      # workflow copy has already cost this project once.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — nothing to do."
            exit 0
          fi
          deno run --allow-read scripts/release-notes.ts "$version" > "$RUNNER_TEMP/notes.md"
          prerelease=''
          case "$version" in *-*) prerelease='--prerelease' ;; esac
          # --verify-tag: without it `gh release create` CREATES a missing tag
          # from the default branch, so a deleted or mistyped tag would produce
          # a release pointing at a commit other than the one just published.
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            $prerelease
