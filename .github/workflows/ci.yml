name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deno:
    name: Format / Lint / Check / Test (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno task fmt:check

      - name: Lint
        run: deno task lint

      - name: Type check
        run: deno task check

      - name: Example applications
        run: deno task check:apps

      - name: Test
        run: deno task test

      - name: Test with coverage
        run: deno task test:coverage

  publish-dry-run:
    name: JSR publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Validates every workspace package against JSR's publish rules without
      # publishing: exports resolve, package metadata is complete, and the
      # public API is free of "slow types". Slow types block JSR's automatic
      # .d.ts generation, which is precisely what the Node and Bun compat jobs
      # below will consume — so this job is the upstream gate for both.
      #
      # No --allow-dirty: a fresh checkout is clean, and a dirty tree here
      # would mean a previous step mutated the working copy.
      - name: Publish dry-run
        run: deno task publish:check

  node-compat:
    name: Node compatibility (stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # BLOCKED ON FIRST PUBLISH. This job installs the packages via JSR's npm
      # compatibility layer and runs the compat suite under Node
      # (AI_GUIDELINES.md §4.5). It cannot run against the working tree:
      # cross-package specifiers are `jsr:@hono-enterprise/*` and the optional
      # heavy deps are imported as `npm:*`, neither of which Node resolves.
      # JSR rewrites both at publish time, so the published artifact is the
      # only thing that can be tested.
      #
      # Unblocks at the first (pre-)release publish to JSR. That must happen no
      # later than Milestone 34, whose CLI generates `--runtime node|bun`
      # projects that consume these packages from npm. See ROADMAP.md M34/M40.
      - name: Placeholder
        run: echo "Node compat suite is blocked on the first JSR publish (see comment)."

  bun-compat:
    name: Bun compatibility (stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same as node-compat, but running the compat suite under Bun.
      - name: Placeholder
        run: echo "Bun compat suite is blocked on the first JSR publish (see node-compat)."

  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Native dependency audit (JSR + npm deps in deno.lock).
      # OSV-Scanner is not used: it has no deno.lock support.
      - name: Audit
        run: deno task audit
