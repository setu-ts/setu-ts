name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# A new push to a pull request supersedes the run already going for it, so that
# run is cancelled rather than finishing a result nobody will read. Pushes to
# `main` and `develop` each get a group of their own (the run id), so no
# integration run is ever cancelled or queued behind another.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Credential persistence (issue #340). `actions/checkout` writes GITHUB_TOKEN into the local git
# config by default, so anything the job runs afterwards can read it — including third-party code
# this workflow resolves, installs and in places imports. Every job below was reviewed one at a
# time, and NONE performs a networked git operation: the only git commands anywhere in these gates
# are `git show <tag>:<path>`, `git rev-parse`, `git ls-files` and `git diff`, all local reads.
# So every checkout here sets `persist-credentials: false`, each with its own reason recorded at
# the step. `fetch-depth: 0` still works, because the fetch happens during checkout while the
# credential is live; only its persistence afterwards is dropped. A job that later needs a real
# git credential must say so at its own step and explain the operation — see the release job in
# `release.yml`, which keeps one for exactly that reason.

jobs:
  browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Browser validation runs contributor code but needs no Git credential.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - name: Install Chromium for the pinned browser suite
        run: npx --yes playwright@1.63.0 install --with-deps chromium
      - name: Browser gate (example and fresh scaffold)
        run: pnpm run check:browser
  # This is deliberately the only job a fork PR can run. It does not check out contributor code,
  # start a service, or receive secrets. A failure prevents GitHub from treating the skipped,
  # resource-intensive jobs below as successful required checks. It has no checkout step, so there
  # is no credential to persist and nothing to decide.
  fork-contribution-policy:
    name: Fork contribution policy
    runs-on: ubuntu-latest
    steps:
      - name: Require validation from a repository branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]; then
            echo "Fork pull requests are proposals only. After accepting a contribution, a maintainer must reproduce it in a repository branch, where the full validation suite runs."
            exit 1
          fi

  # Fork PRs remain visible for maintainer triage but do not start repository validation jobs or
  # service containers. An accepted contribution is validated from a trusted repository branch.
  # The gates and the test suite run as parallel shards of one job, each on its
  # own runner with the full set of backends; `node-gate` below reports them
  # under the one required check name. Every package measures and enforces its
  # own per-file coverage in its own Vitest run. The CLI splits within one member:
  # its three blobs are merged by cli-coverage, which enforces full per-file coverage.
  #   static     — format, lint, type check, docs, examples, async guard
  #   cli-1..3   — isolated CLI suites split by Vitest, with merged coverage
  #   messaging  — messaging-plugin, the second longest
  #   packages   — every other member (a new member lands here by default)
  #   tooling    — root and script tests
  node:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Format / Lint / Check / Test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # One failing shard must not cancel the others: the full picture is what
      # saves a second push.
      fail-fast: false
      matrix:
        shard: [static, cli-1, cli-2, cli-3, messaging, packages, tooling]
    env:
      # Includes guarded messaging Redis Streams restart/redelivery tests.
      REDIS_URL: redis://localhost:6379
      SQS_ENDPOINT_URL: http://localhost:9324
      SQS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # M70c §3.7 real-outage suites: a real broker/backend, really stopped.
      # Guarded on these env vars and NOT in ALLOW_SKIP, so a dropped service
      # or a missing var fails the job instead of quietly skipping.
      RABBITMQ_URL: amqp://localhost:5672
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: m70c-verify
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      SMTP_URL: smtp://localhost:1025
      MONGODB_URI: mongodb://127.0.0.1:27017
      # M80 §6.2: the real-emulator DynamoDB suite (database-plugin) guards on
      # this exact endpoint, which is also the host:port the package manifest's
      # net grant scopes.
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
      # M109b within-real uses this separate guard for the same emulator.
      DYNAMODB_ENDPOINT_URL: http://127.0.0.1:8000
      # M82 §3.13: the real-emulator Bigtable suite (database-plugin) guards on
      # this exact endpoint, which is also the host:port the package manifest's
      # net grant scopes. `127.0.0.1` rather than `localhost` deliberately: the
      # SDK speaks gRPC, and a `host:port` grant does not authorize a DNS
      # lookup, so an IP literal is what keeps the grant endpoint-scoped (the
      # M70g Pub/Sub lesson).
      BIGTABLE_EMULATOR_ENDPOINT: 127.0.0.1:8086
      # M100b §6: the real-provider Keycloak suite (auth-plugin) guards on this
      # exact base URL, which is also the host:port the manifest's net grant scopes.
      KEYCLOAK_URL: http://localhost:8180
      # M90d §3.5: the real-backend NATS and Kafka suites (messaging-plugin)
      # guard on these exact endpoints, which are also the host:port pairs the
      # package manifest's net grant scopes. Started by the steps below.
      NATS_URL: nats://127.0.0.1:4222
      KAFKA_BROKERS: 127.0.0.1:9092
      # M107 §6 (C8): the outbox real-backend suites (messaging-plugin) guard on
      # these. `OUTBOX_POSTGRES_URL` is a DISTINCT variable from the bare one
      # so the database-plugin live-Postgres cells (which need a generated Prisma
      # client) keep ignoring here. Port 5433, not 5432: it is the port
      # database-plugin's net grant already names, and the one the local
      # backend runs on. `MONGODB_RS_URI` is a single-node REPLICA SET on its own
      # port — the `mongo` service below is standalone, and a standalone server
      # refuses transactions, which the outbox needs.
      OUTBOX_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5433/postgres
      MONGODB_RS_URI: mongodb://127.0.0.1:27018/?replicaSet=rs0&directConnection=true
    services:
      # M107 §6 (C8): PostgreSQL for the outbox real-backend suites, on host port
      # 5433 (see OUTBOX_POSTGRES_URL above).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mongo:
        # mongo:7, not 8: MongoDB 8.0+ crashes on Linux 6.19+ (its TCMalloc breaks the
        # kernel's rseq ABI; SERVER-121912, no fixed release named), and the runner
        # images moved to kernel 7.0 on 2026-10-18. Return to mongo:8 once a fixed
        # MongoDB release exists.
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticmq:
        image: softwaremill/elasticmq-native:1.7.1
        ports:
          - 9324:9324
        # The image ships neither curl nor a 2xx-answering root path — ElasticMQ
        # returns 400 to a bare GET / — so an HTTP probe can never pass. `nc` is
        # present and a port check is what readiness actually means here.
        options: >-
          --health-cmd "nc -z localhost 9324 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # M70c §3.7: the RabbitMQ outage suites (messaging broker + queue) need a
      # real broker to stop and restart. Higher retries than the other services:
      # the Erlang VM needs a few seconds before `rabbitmq-diagnostics ping`
      # answers, and the outage test stops/restarts the container, so the
      # service must be healthy before the first test runs.
      rabbitmq:
        # Major version 4 is load-bearing (M70l X10-1): 3.13 accepts the queue
        # declaration the broker used to emit, so the defect is invisible there.
        image: rabbitmq:4-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      # M70c §3.7: the S3 outage suite (storage-plugin) needs a real
      # S3-compatible gateway. The bucket is created by the test itself
      # (ensureBucket), so the service starts with an empty data dir.
      # M70c §3.7: the SMTP outage suite (mail-plugin) needs a real SMTP
      # server. Only the SMTP port is published; readiness uses Mailpit's own
      # `readyz` subcommand because the image ships neither curl nor a
      # `/health` route (verified: `/health` 404s, `/readyz` answers 200).
      mailpit:
        image: axllent/mailpit:v1.20.4
        ports:
          - 1025:1025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # M80 §6.2: the real-emulator DynamoDB suite (database-plugin) needs the
      # emulator. A bare GET / answers 400, so a naive `curl -f /` could never
      # pass — but curl IS in the image, and a POST ListTables answers 200 once
      # the emulator is ready (M80 §1A E3, measured). Like ElasticMQ above,
      # the probe has to match what readiness actually means here.
      # DynamoDB Local answers a bare `GET /` with 400, so a naive `curl -f /`
      # healthcheck can never pass (the ElasticMQ situation above). A POST
      # ListTables does answer 200 — but ONLY with an `Authorization` header:
      # without one the server replies 400 and `curl -f` exits 22, which is how
      # this check first shipped and left the container permanently unhealthy.
      # The credential is inert (DynamoDB Local never validates it); it is the
      # header's PRESENCE that makes the request well-formed.
      dynamodb:
        # Pinned to a version rather than `latest`: every other service in
        # this workflow pins at least a major (mongo:7, redis:7, rabbitmq:4),
        # and a floating tag can change the emulator's behaviour between runs.
        # A sha256 digest is deliberately not used — no other service here is
        # digest-pinned, and the asymmetry would be the surprising part.
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -sf -X POST -H 'X-Amz-Target: DynamoDB_20120810.ListTables' -H 'Content-Type: application/x-amz-json-1.0' -H 'Authorization: AWS4-HMAC-SHA256 Credential=ci/20260101/us-east-1/dynamodb/aws4_request' -d '{}' http://localhost:8000/"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Executes third-party code: `pnpm install` resolves the whole graph,
          # the suite lazily imports npm drivers, and `check:apps` runs every
          # example application. No step needs a credential
          # afterwards — git only reads local objects and checks for app
          # lockfile drift; none of these commands touches the remote.
          persist-credentials: false
          # The changelog-coverage gate compares each published barrel against the
          # last RELEASE TAG, and a shallow checkout fetches no tags — it would fail
          # closed on every run. Full history is what makes the comparison possible.
          # Fetched HERE, while checkout still holds the credential, so dropping it
          # above costs the gate nothing.
          fetch-depth: 0

      # Deno is a subject here, not tooling: the SDK fixtures are formatted with
      # `deno fmt` (their generator's target), and the CLI e2e suites scaffold and
      # run `--runtime deno` projects.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      # apps/realtime-clients executes the SDK's portable transports under the
      # native Node and Bun globals; neither runtime may be an accidental skip.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      # Requires the committed lockfile and refuses a dependency graph that
      # would alter it, so the tests run only against the reviewed resolution.
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # M100b §6: the real-provider Keycloak suite (auth-plugin) guards on
      # KEYCLOAK_URL. A step rather than a `services:` container because the
      # realm is imported at startup — `start-dev --import-realm` is a COMMAND
      # and the realm file is a volume, neither of which a service block can
      # set. Readiness is the realm's own discovery document, which is exactly
      # what the suite reads first.
      - name: Start Keycloak (outside-issuer suite)
        run: |
          docker run -d --name keycloak -p 127.0.0.1:8180:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$GITHUB_WORKSPACE/packages/auth-plugin/test/fixtures/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.4 start-dev --import-realm
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8180/realms/setu/.well-known/openid-configuration >/dev/null; then
              echo 'keycloak ready'
              exit 0
            fi
            sleep 2
          done
          echo 'keycloak did not become ready'
          docker logs keycloak
          exit 1

      # The Cloud Bigtable emulator cannot be a `services:` container. The
      # Google Cloud CLI image's default command is a shell — the emulator is
      # started by `gcloud beta emulators bigtable start` — and a service block
      # has no way to set one, because `options` reaches `docker create` BEFORE
      # the image while the command comes after it. So it is started here, early
      # enough that the 1.75 GB pull overlaps with the format, lint and type
      # gates below rather than adding to the critical path.
      #
      # It earns that pull because M53's thesis holds: a real-backend proof CI
      # never runs is not a proof, and every push-down this adapter makes is
      # only correct if the service agrees. The emulator implements NO instance
      # admin API — `instance.create()` answers `12 UNIMPLEMENTED` — so
      # instances are implicit and the guarded suite creates tables directly.
      #
      # Readiness is a raw TCP connect: the emulator speaks gRPC, so there is no
      # HTTP endpoint to curl and the image carries no gRPC client of its own.
      - name: Start the Cloud Bigtable emulator
        run: |
          docker run -d --name bigtable-emulator -p 127.0.0.1:8086:8086 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators bigtable start --host-port=0.0.0.0:8086
          for _ in $(seq 1 60); do
            if docker exec bigtable-emulator bash -c 'echo > /dev/tcp/127.0.0.1/8086' 2>/dev/null; then
              echo 'bigtable emulator ready'
              exit 0
            fi
            sleep 2
          done
          echo 'bigtable emulator did not become ready'
          docker logs bigtable-emulator
          exit 1

      # M90d §3.5: the NATS server cannot be a `services:` container —
      # JetStream is enabled by the `-js` COMMAND-LINE flag, and a service
      # block has no way to set one (`options` reaches `docker create` before
      # the image while the command comes after it). Readiness is a port check:
      # nats-server binds 4222 only once it is serving, and the SUITE is what
      # proves JetStream is actually on (a `-js`-less server still opens the
      # port, and every stream operation would answer the raw `503` X28-3
      # names).
      - name: Start the NATS server (JetStream)
        run: |
          docker run -d --name m90d-nats -p 127.0.0.1:4222:4222 nats:2-alpine -js
          for _ in $(seq 1 60); do
            if docker exec m90d-nats nc -z 127.0.0.1 4222 2>/dev/null; then
              echo 'nats ready'
              exit 0
            fi
            sleep 2
          done
          echo 'nats server did not become ready'
          docker logs m90d-nats
          exit 1

      # M90d §3.5: Kafka KRaft single-node needs a controlled startup, and
      # readiness must mean more than an open port — the image takes ~10 s to
      # become a real group member, and the suite's first produce against a
      # half-started broker fails confusingly rather than skipping.
      # kafka-broker-api-versions.sh answers only once the broker serves
      # metadata, which an open 9092 does not prove.
      - name: Start Kafka (KRaft single-node)
        run: |
          docker run -d --name m90d-kafka -p 127.0.0.1:9092:9092 apache/kafka:4.0.0
          for _ in $(seq 1 90); do
            if docker exec m90d-kafka /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9092 > /dev/null 2>&1; then
              echo 'kafka ready'
              exit 0
            fi
            sleep 2
          done
          echo 'kafka did not become ready'
          docker logs m90d-kafka
          exit 1

      # M107 §6 (C8): a single-node MongoDB REPLICA SET for the outbox suites.
      # It cannot be the `mongo` service: `--replSet` is a command-line flag a
      # service block cannot pass (`options` reaches `docker create` before the
      # image), and that service must stay standalone, because the outbox's
      # startup refusal of a standalone server is itself under test. Its own
      # port, so both run side by side. Readiness means a PRIMARY exists, not an
      # open port: transactions are refused until the member is elected.
      - name: Start a MongoDB replica set (outbox suites)
        run: |
          docker run -d --name mongo-rs -p 127.0.0.1:27018:27018 mongo:7 \
            --replSet rs0 --port 27018 --bind_ip_all
          for _ in $(seq 1 60); do
            if docker exec mongo-rs mongosh --port 27018 --quiet \
              --eval 'db.runCommand({ ping: 1 }).ok' > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec mongo-rs mongosh --port 27018 --quiet --eval \
            "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27018' }] })"
          for _ in $(seq 1 60); do
            if docker exec mongo-rs mongosh --port 27018 --quiet \
              --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then
              echo 'mongodb replica set ready'
              exit 0
            fi
            sleep 2
          done
          echo 'mongodb replica set did not elect a primary'
          docker logs mongo-rs
          exit 1

      # M70c §3.7: the S3 outage suite (storage-plugin) needs a real
      # S3-compatible server, and it cannot be a `services:` container: the
      # image's entrypoint is the bare `minio` binary, so `server /data` must
      # be passed as an argument, which a service block cannot do (`options`
      # reaches `docker create` before the image, arguments come after it) —
      # the constraint behind the NATS and Kafka steps too.
      #
      # Registry history, because this has broken twice. Docker Hub's
      # `minio/minio` stopped serving anonymous pulls on 2026-09-11, and
      # quay.io's `minio/minio` followed on 2026-09-24 (the repository API
      # answers 401 and every pull is `unauthorized`); upstream no longer
      # distributes images. Chainguard builds MinIO from source and serves it
      # anonymously, but only as `:latest` — so the image is pinned by DIGEST
      # (RELEASE.2026-09-22T19-25-18Z, verified against both storage-plugin
      # real-backend suites). If that digest ever stops pulling, repin to the
      # current digest and re-run those suites against it:
      #   docker pull cgr.dev/chainguard/minio:latest
      #   docker image inspect --format '{{index .RepoDigests 0}}' \
      #     cgr.dev/chainguard/minio:latest
      - name: Start MinIO (S3 storage outage suite)
        run: |
          docker run -d --name m70c-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1 server /data
          for _ in $(seq 1 60); do
            if curl -fs http://localhost:9000/minio/health/ready >/dev/null; then
              echo 'minio ready'
              exit 0
            fi
            sleep 2
          done
          echo 'minio did not become ready'
          docker logs m70c-minio
          exit 1

      - name: Format check
        if: matrix.shard == 'static'
        run: pnpm run fmt:check

      - name: Lint
        if: matrix.shard == 'static'
        run: pnpm run lint

      - name: Type check
        if: matrix.shard == 'static'
        run: pnpm run check

      # Catches a committed doc that renders wrong while every other gate stays
      # green: a runaway code fence swallowing the rest of the file, an anchor
      # link pointing at a heading that no longer exists, or a section absent
      # from its own table of contents. Prettier accepts all three.
      - name: Documentation check
        if: matrix.shard == 'static'
        run: pnpm run check:docs

      - name: Example applications
        if: matrix.shard == 'static'
        run: |
          pnpm run check:apps
          git diff --exit-code -- apps
        env:
          ALLOW_SKIP: cloudflare

      - name: Async assertion guard
        if: matrix.shard == 'static'
        run: node scripts/codemods/std-to-vitest.ts --check

      # `pnpm test:coverage` with no options also runs the tooling target, so
      # each package shard passes `--no-tooling` and the tooling shard runs it
      # exactly once. The `packages` shard is every member except the ones with
      # a shard of their own; a misspelt `--skip` refuses rather than running.
      - name: Node package tests with coverage (cli-1)
        if: matrix.shard == 'cli-1'
        run: pnpm test:coverage --no-tooling cli --shard 1/3

      - uses: actions/upload-artifact@v4
        if: matrix.shard == 'cli-1'
        with:
          name: cli-blob-1
          path: .vitest-reports/cli/blob-1.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Node package tests with coverage (cli-2)
        if: matrix.shard == 'cli-2'
        run: pnpm test:coverage --no-tooling cli --shard 2/3

      - uses: actions/upload-artifact@v4
        if: matrix.shard == 'cli-2'
        with:
          name: cli-blob-2
          path: .vitest-reports/cli/blob-2.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Node package tests with coverage (cli-3)
        if: matrix.shard == 'cli-3'
        run: pnpm test:coverage --no-tooling cli --shard 3/3

      - uses: actions/upload-artifact@v4
        if: matrix.shard == 'cli-3'
        with:
          name: cli-blob-3
          path: .vitest-reports/cli/blob-3.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Node package tests with coverage (messaging-plugin)
        if: matrix.shard == 'messaging'
        run: pnpm test:coverage --no-tooling messaging-plugin

      - name: Node package tests with coverage (all other members)
        if: matrix.shard == 'packages'
        run: pnpm test:coverage --no-tooling --skip cli --skip messaging-plugin

      - name: Root and script tests with coverage
        if: matrix.shard == 'tooling'
        run: pnpm run test:tooling:coverage

  cli-coverage:
    needs: node
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Report merging reads local sources and needs no Git credential.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-blob-*
          path: .vitest-reports/cli/
          merge-multiple: true
      - name: Require all CLI blobs and enforce merged coverage
        run: |
          for i in 1 2 3; do
            test -f ".vitest-reports/cli/blob-$i.json"
          done
          pnpm test:coverage --no-tooling cli --merge

  # The required status check. A matrix reports one check per shard, under
  # names the rulesets do not list, so this job carries the name they do. It
  # runs `always()`: a skipped required check counts as passing, so without it
  # a failed shard would leave this job skipped and the pull request mergeable.
  # Fork pull requests skip it exactly as they skipped the single job before;
  # the fork contribution policy job is what fails them.
  node-gate:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Format / Lint / Check / Test
    needs: [node, cli-coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.node.result }}
          CLI_COVERAGE_RESULT: ${{ needs.cli-coverage.result }}
        run: |
          echo "node shards: $RESULT"
          test "$RESULT" = success
          echo "cli coverage: $CLI_COVERAGE_RESULT"
          test "$CLI_COVERAGE_RESULT" = success

  deno-lane:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Deno runtime lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Executes third-party code (the lane's npm graph) but runs no git command.
          persist-credentials: false

      # The lane's subject: Deno-only runtime proofs, checked and run against the
      # committed test/deno-lane/deno.lock.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      # The driver is a Node script, and the lane imports the workspace's
      # installed npm graph.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Deno runtime proofs with coverage
        run: pnpm run test:deno-lane

  boundary-compatibility:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Boundary compatibility matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Executes third-party code: this job exists to install and exercise
          # several supported third-party majors. It runs no git command at all.
          persist-credentials: false

      # The matrix files are Vitest suites since M111b, so they run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      # The ordinary suite can pass with only one supported third-party major
      # installed. This targeted matrix makes the declared boundary claims
      # independently visible in CI.
      - name: Boundary compatibility matrix
        run: pnpm run check:compat

  # M111a §3.10: every member builds with tsc, packs with pnpm, and installs
  # with PLAIN npm into an empty project that then serves a request and a
  # tsc-compiled decorated controller on Node 24, Node 22 and Bun. The Deno
  # gates cannot see any of it, and without a job the Node build rots before
  # the test suite moves to Node (111b). `--require-all` turns a missing
  # runtime into a failure rather than a reported skip.
  node-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Node build (pack and boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Installs and executes the packed tarballs' third-party dependencies;
          # it runs no git command at all.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm comes from the root package.json's `packageManager` pin.
      - name: Enable corepack
        run: corepack enable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # The manifest check imports `yaml` (the workspace list reader), so the
      # repository dependencies are installed first.
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Generated manifests agree with the sources
        run: node scripts/node-manifests.ts --check

      - name: Pack and boot on Node 24, Node 22 and Bun
        run: pnpm run check:node-build --require-all

  # Deployment artifacts are YAML and Dockerfiles: the format, lint and type
  # gates cannot see a defect in any of them. Only building the images
  # and applying the manifests to a real cluster can, and each of these has
  # already caught something the other gates passed over — a probe path that
  # 404s, an image whose non-numeric user Kubernetes refuses, a RoleBinding
  # naming the wrong namespace, and a Service selector matching no pod (which
  # `kubectl apply` accepts without complaint).
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Docker / Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Executes third-party code: the image builds run `pnpm install`, which
          # resolves the dependency graph, and the cluster gate
          # drives kind, kubectl and helm. It runs no git command at all.
          persist-credentials: false

      # `check:deploy --generated` scaffolds and builds a Deno-target project.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      # M120: the generated gate also installs a Bun workspace's lockfile on the
      # host before building its image.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Docker is preinstalled on ubuntu-latest; kind, kubectl and helm are not.
      - uses: helm/kind-action@v1
        with:
          cluster_name: setu-deploy-gate
          # Every version here is pinned, kubectl included. The action defaults
          # kubectl to the newest release, which drifts on its own schedule: it
          # reached v1.35.0 against this v1.31 server — four minors outside
          # kubectl's supported +/-1 skew — and the job started failing on a
          # branch that touched neither the manifests nor the chart. The chart's
          # API versions (autoscaling/v2, policy/v1, discovery.k8s.io/v1) are
          # what the node image has to satisfy; the client is pinned to match
          # the server rather than the calendar.
          version: v0.31.0
          kubectl_version: v1.31.4
          node_image: kindest/node:v1.31.2

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      # The generated mode scaffolds through the Node `setu` binary and installs
      # the scaffold from a local registry serving this tree's own packs, which
      # are built with the workspace's TypeScript — so it needs Node and an
      # installed workspace.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Render drift, image builds, the Compose model, and the generated workspace.
      - name: Deployment gate
        run: pnpm run check:deploy

      # The real proof: apply the COMMITTED manifests to the cluster, wait for
      # a rollout (which only completes if the readiness probe passes), serve a
      # request through the Service, and verify the discovery RBAC.
      #
      # kind-action already created the cluster, so the gate reuses it.
      # KEEP_CLUSTER stops the gate deleting a cluster the action owns.
      - name: Cluster end-to-end
        # --workspace (M122) runs first: a scaffolded workspace's root test, then
        # `setu workspace deploy` into this cluster.
        run: pnpm run check:deploy --cluster --workspace
        env:
          KEEP_CLUSTER: '1'

  publish-dry-run:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: npm publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Install without lifecycle scripts (same flags as publish)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Publish dry-run
        run: pnpm run release:publish --dry-run
      - name: Release consistency
        run: pnpm run release:verify "$(jq -r .version packages/kernel/package.json)"
      - name: Sweep for residual version references
        run: pnpm run check:versions

  # Node/Bun compat lives in compat.yml and consumes the published npm packages
  # at latest, testing the last release independently of HEAD. This separate
  # job proves a Deno project resolves the npm view-plugin release, records it
  # as an `npm:` import and in the lock, and imports it.
  deno-view-plugin-resolution:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Deno view-plugin resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The strongest case in this workflow, and the same one the two compat
          # jobs document: it resolves a package from a public registry and then
          # dynamically IMPORTS it, so third-party code executes here. It runs no
          # git command at all.
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      - name: Resolve and import from a clean Deno project
        run: |
          temporary="$(mktemp -d)"
          cd "$temporary"
          deno init --quiet
          deno add --minimum-dependency-age=0 npm:@setu-ts/view-plugin
          deno eval --allow-read --allow-env --config deno.json '
            const config = JSON.parse(await Deno.readTextFile("deno.json"));
            const specifier = config.imports?.["@setu-ts/view-plugin"];
            if (typeof specifier !== "string" || !specifier.startsWith("npm:@setu-ts/view-plugin@")) {
              throw new Error("deno add did not record the view-plugin npm dependency");
            }
            const lock = JSON.parse(await Deno.readTextFile("deno.lock"));
            if (!Object.keys(lock.npm ?? {}).some((key) => key.startsWith("@setu-ts/view-plugin@"))) {
              throw new Error("deno add did not lock the view-plugin npm dependency");
            }
            await import("@setu-ts/view-plugin");
          '

  audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Does NOT execute third-party code — it reads `pnpm-lock.yaml` and queries
          # the advisory endpoints — but it needs no credential either, so the
          # default persistence is a credential in reach for no benefit. It runs
          # no git command at all.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      # `pnpm audit` over pnpm-lock.yaml.
      #
      # `audit:ci`, not `audit`: the npm advisory endpoint flakes, and a bare
      # `pnpm audit` then fails having scanned nothing. The wrapper retries a
      # REGISTRY failure and fails immediately on a real advisory — and still
      # fails if every attempt is a registry failure, because "could not scan"
      # is not "no vulnerabilities". See scripts/audit.ts for why
      # `--ignore-registry-errors` is deliberately not used.
      - name: Audit
        run: pnpm run audit:ci
