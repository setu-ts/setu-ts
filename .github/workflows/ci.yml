name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Credential persistence (issue #340). `actions/checkout` writes GITHUB_TOKEN into the local git
# config by default, so anything the job runs afterwards can read it — including third-party code
# this workflow resolves, installs and in places imports. Every job below was reviewed one at a
# time, and NONE performs a networked git operation: the only git commands anywhere in these gates
# are `git show <tag>:<path>`, `git rev-parse` and `git ls-files`, which are local object reads.
# So every checkout here sets `persist-credentials: false`, each with its own reason recorded at
# the step. `fetch-depth: 0` still works, because the fetch happens during checkout while the
# credential is live; only its persistence afterwards is dropped. A job that later needs a real
# git credential must say so at its own step and explain the operation — see the release job in
# `release.yml`, which keeps one for exactly that reason.

jobs:
  # This is deliberately the only job a fork PR can run. It does not check out contributor code,
  # start a service, or receive secrets. A failure prevents GitHub from treating the skipped,
  # resource-intensive jobs below as successful required checks. It has no checkout step, so there
  # is no credential to persist and nothing to decide.
  fork-contribution-policy:
    name: Fork contribution policy
    runs-on: ubuntu-latest
    steps:
      - name: Require validation from a repository branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]; then
            echo "Fork pull requests are proposals only. After accepting a contribution, a maintainer must reproduce it in a repository branch, where the full validation suite runs."
            exit 1
          fi

  # Fork PRs remain visible for maintainer triage but do not start repository validation jobs or
  # service containers. An accepted contribution is validated from a trusted repository branch.
  deno:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Format / Lint / Check / Test (Deno)
    runs-on: ubuntu-latest
    env:
      REDIS_URL: redis://localhost:6379
      SQS_ENDPOINT_URL: http://localhost:9324
      SQS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # M70c §3.7 real-outage suites: a real broker/backend, really stopped.
      # Guarded on these env vars and NOT in ALLOW_SKIP, so a dropped service
      # or a missing var fails the job instead of quietly skipping.
      RABBITMQ_URL: amqp://localhost:5672
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: m70c-verify
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      SMTP_URL: smtp://localhost:1025
      MONGODB_URI: mongodb://127.0.0.1:27017
      # M80 §6.2: the real-emulator DynamoDB suite (database-plugin) guards on
      # this exact endpoint, which is also the host:port the package manifest's
      # net grant scopes.
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
      # M82 §3.13: the real-emulator Bigtable suite (database-plugin) guards on
      # this exact endpoint, which is also the host:port the package manifest's
      # net grant scopes. `127.0.0.1` rather than `localhost` deliberately: the
      # SDK speaks gRPC, and a `host:port` grant does not authorize a DNS
      # lookup, so an IP literal is what keeps the grant endpoint-scoped (the
      # M70g Pub/Sub lesson).
      BIGTABLE_EMULATOR_ENDPOINT: 127.0.0.1:8086
      # M90d §3.5: the real-backend NATS and Kafka suites (messaging-plugin)
      # guard on these exact endpoints, which are also the host:port pairs the
      # package manifest's net grant scopes. Started by the steps below.
      NATS_URL: nats://127.0.0.1:4222
      KAFKA_BROKERS: 127.0.0.1:9092
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticmq:
        image: softwaremill/elasticmq-native:1.7.1
        ports:
          - 9324:9324
        # The image ships neither curl nor a 2xx-answering root path — ElasticMQ
        # returns 400 to a bare GET / — so an HTTP probe can never pass. `nc` is
        # present and a port check is what readiness actually means here.
        options: >-
          --health-cmd "nc -z localhost 9324 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # M70c §3.7: the RabbitMQ outage suites (messaging broker + queue) need a
      # real broker to stop and restart. Higher retries than the other services:
      # the Erlang VM needs a few seconds before `rabbitmq-diagnostics ping`
      # answers, and the outage test stops/restarts the container, so the
      # service must be healthy before the first test runs.
      rabbitmq:
        # Major version 4 is load-bearing (M70l X10-1): 3.13 accepts the queue
        # declaration the broker used to emit, so the defect is invisible there.
        image: rabbitmq:4-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      # M70c §3.7: the S3 outage suite (storage-plugin) needs a real
      # S3-compatible gateway. The bucket is created by the test itself
      # (ensureBucket), so the service starts with an empty data dir.
      # M70c §3.7: the SMTP outage suite (mail-plugin) needs a real SMTP
      # server. Only the SMTP port is published; readiness uses Mailpit's own
      # `readyz` subcommand because the image ships neither curl nor a
      # `/health` route (verified: `/health` 404s, `/readyz` answers 200).
      mailpit:
        image: axllent/mailpit:v1.20.4
        ports:
          - 1025:1025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # M80 §6.2: the real-emulator DynamoDB suite (database-plugin) needs the
      # emulator. A bare GET / answers 400, so a naive `curl -f /` could never
      # pass — but curl IS in the image, and a POST ListTables answers 200 once
      # the emulator is ready (M80 §1A E3, measured). Like ElasticMQ above,
      # the probe has to match what readiness actually means here.
      # DynamoDB Local answers a bare `GET /` with 400, so a naive `curl -f /`
      # healthcheck can never pass (the ElasticMQ situation above). A POST
      # ListTables does answer 200 — but ONLY with an `Authorization` header:
      # without one the server replies 400 and `curl -f` exits 22, which is how
      # this check first shipped and left the container permanently unhealthy.
      # The credential is inert (DynamoDB Local never validates it); it is the
      # header's PRESENCE that makes the request well-formed.
      dynamodb:
        # Pinned to a version rather than `latest`: every other service in
        # this workflow pins at least a major (mongo:8, redis:7, rabbitmq:4),
        # and a floating tag can change the emulator's behaviour between runs.
        # A sha256 digest is deliberately not used — no other service here is
        # digest-pinned, and the asymmetry would be the surprising part.
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -sf -X POST -H 'X-Amz-Target: DynamoDB_20120810.ListTables' -H 'Content-Type: application/x-amz-json-1.0' -H 'Authorization: AWS4-HMAC-SHA256 Credential=ci/20260101/us-east-1/dynamodb/aws4_request' -d '{}' http://localhost:8000/"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Executes third-party code: `deno ci` resolves the whole graph, the
          # suite lazily imports `npm:` drivers, and `check:apps` installs
          # dependencies into the example projects. No step needs a credential
          # afterwards — the only git this job runs is three LOCAL object reads
          # (`git show` at a release tag, `git rev-parse`, `git ls-files`), none
          # of which touches the remote.
          persist-credentials: false
          # The changelog-coverage gate compares each published barrel against the
          # last RELEASE TAG, and a shallow checkout fetches no tags — it would fail
          # closed on every run. Full history is what makes the comparison possible.
          # Fetched HERE, while checkout still holds the credential, so dropping it
          # above costs the gate nothing.
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      # apps/realtime-clients executes the SDK's portable transports under the
      # native Node and Bun globals; neither runtime may be an accidental skip.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Requires the committed lockfile and refuses a dependency graph that
      # would alter it. The tests below therefore run only against the reviewed
      # resolution rather than silently absorbing a new range result.
      - name: Frozen dependency install
        run: deno ci

      # The Cloud Bigtable emulator cannot be a `services:` container. The
      # Google Cloud CLI image's default command is a shell — the emulator is
      # started by `gcloud beta emulators bigtable start` — and a service block
      # has no way to set one, because `options` reaches `docker create` BEFORE
      # the image while the command comes after it. So it is started here, early
      # enough that the 1.75 GB pull overlaps with the format, lint and type
      # gates below rather than adding to the critical path.
      #
      # It earns that pull because M53's thesis holds: a real-backend proof CI
      # never runs is not a proof, and every push-down this adapter makes is
      # only correct if the service agrees. The emulator implements NO instance
      # admin API — `instance.create()` answers `12 UNIMPLEMENTED` — so
      # instances are implicit and the guarded suite creates tables directly.
      #
      # Readiness is a raw TCP connect: the emulator speaks gRPC, so there is no
      # HTTP endpoint to curl and the image carries no gRPC client of its own.
      - name: Start the Cloud Bigtable emulator
        run: |
          docker run -d --name bigtable-emulator -p 127.0.0.1:8086:8086 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators bigtable start --host-port=0.0.0.0:8086
          for _ in $(seq 1 60); do
            if docker exec bigtable-emulator bash -c 'echo > /dev/tcp/127.0.0.1/8086' 2>/dev/null; then
              echo 'bigtable emulator ready'
              exit 0
            fi
            sleep 2
          done
          echo 'bigtable emulator did not become ready'
          docker logs bigtable-emulator
          exit 1

      # M90d §3.5: the NATS server cannot be a `services:` container —
      # JetStream is enabled by the `-js` COMMAND-LINE flag, and a service
      # block has no way to set one (`options` reaches `docker create` before
      # the image while the command comes after it). Readiness is a port check:
      # nats-server binds 4222 only once it is serving, and the SUITE is what
      # proves JetStream is actually on (a `-js`-less server still opens the
      # port, and every stream operation would answer the raw `503` X28-3
      # names).
      - name: Start the NATS server (JetStream)
        run: |
          docker run -d --name m90d-nats -p 127.0.0.1:4222:4222 nats:2-alpine -js
          for _ in $(seq 1 60); do
            if docker exec m90d-nats nc -z 127.0.0.1 4222 2>/dev/null; then
              echo 'nats ready'
              exit 0
            fi
            sleep 2
          done
          echo 'nats server did not become ready'
          docker logs m90d-nats
          exit 1

      # M90d §3.5: Kafka KRaft single-node needs a controlled startup, and
      # readiness must mean more than an open port — the image takes ~10 s to
      # become a real group member, and the suite's first produce against a
      # half-started broker fails confusingly rather than skipping.
      # kafka-broker-api-versions.sh answers only once the broker serves
      # metadata, which an open 9092 does not prove.
      - name: Start Kafka (KRaft single-node)
        run: |
          docker run -d --name m90d-kafka -p 127.0.0.1:9092:9092 apache/kafka:4.0.0
          for _ in $(seq 1 90); do
            if docker exec m90d-kafka /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9092 > /dev/null 2>&1; then
              echo 'kafka ready'
              exit 0
            fi
            sleep 2
          done
          echo 'kafka did not become ready'
          docker logs m90d-kafka
          exit 1

      # M70c §3.7: the S3 outage suite (storage-plugin) needs a real
      # S3-compatible server, and it cannot be a `services:` container: the
      # image's entrypoint is the bare `minio` binary, so `server /data` must
      # be passed as an argument, which a service block cannot do (`options`
      # reaches `docker create` before the image, arguments come after it) —
      # the constraint behind the NATS and Kafka steps too.
      #
      # Registry history, because this has broken twice. Docker Hub's
      # `minio/minio` stopped serving anonymous pulls on 2026-09-11, and
      # quay.io's `minio/minio` followed on 2026-09-24 (the repository API
      # answers 401 and every pull is `unauthorized`); upstream no longer
      # distributes images. Chainguard builds MinIO from source and serves it
      # anonymously, but only as `:latest` — so the image is pinned by DIGEST
      # (RELEASE.2026-09-22T19-25-18Z, verified against both storage-plugin
      # real-backend suites). If that digest ever stops pulling, repin to the
      # current `cgr.dev/chainguard/minio:latest` digest
      # (`docker inspect --format '{{index .RepoDigests 0}}'`) and re-run
      # those suites against it.
      - name: Start MinIO (S3 storage outage suite)
        run: |
          docker run -d --name m70c-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1 server /data
          for _ in $(seq 1 60); do
            if curl -fs http://localhost:9000/minio/health/ready >/dev/null; then
              echo 'minio ready'
              exit 0
            fi
            sleep 2
          done
          echo 'minio did not become ready'
          docker logs m70c-minio
          exit 1

      - name: Format check
        run: deno task fmt:check

      - name: Lint
        run: deno task lint

      - name: Type check
        run: deno task check

      # Catches a committed doc that renders wrong while every other gate stays
      # green: a runaway code fence swallowing the rest of the file, an anchor
      # link pointing at a heading that no longer exists, or a section absent
      # from its own table of contents. `deno fmt` accepts all three.
      - name: Documentation check
        run: deno task check:docs

      - name: Example applications
        run: deno task check:apps
        env:
          ALLOW_SKIP: cloudflare

      # One suite run, not two. `test:coverage` runs the same `packages test`
      # paths as `deno task test` (the root `test/` directory included, so
      # `test/apps-gate.test.ts` executes on a runner) and adds instrumentation
      # on top, so a separate `Test` step only re-ran everything.
      - name: Test with coverage
        run: deno task test:coverage

  boundary-compatibility:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Boundary compatibility matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Executes third-party code: this job exists to install and exercise
          # several supported third-party majors. It runs no git command at all.
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      - name: Install frozen dependencies
        run: deno ci

      # The ordinary suite can pass with only one supported third-party major
      # installed. This targeted matrix makes the declared boundary claims
      # independently visible in CI.
      - name: Boundary compatibility matrix
        run: deno task check:compat

  # Deployment artifacts are YAML and Dockerfiles: `deno fmt`, `deno lint` and
  # `deno check` cannot see a defect in any of them. Only building the images
  # and applying the manifests to a real cluster can, and each of these has
  # already caught something the other gates passed over — a probe path that
  # 404s, an image whose non-numeric user Kubernetes refuses, a RoleBinding
  # naming the wrong namespace, and a Service selector matching no pod (which
  # `kubectl apply` accepts without complaint).
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Docker / Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Executes third-party code: the image builds run `deno cache`, which
          # resolves and compiles the dependency graph, and the cluster gate
          # drives kind, kubectl and helm. It runs no git command at all.
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      # Docker is preinstalled on ubuntu-latest; kind, kubectl and helm are not.
      - uses: helm/kind-action@v1
        with:
          cluster_name: setu-deploy-gate
          # Every version here is pinned, kubectl included. The action defaults
          # kubectl to the newest release, which drifts on its own schedule: it
          # reached v1.35.0 against this v1.31 server — four minors outside
          # kubectl's supported +/-1 skew — and the job started failing on a
          # branch that touched neither the manifests nor the chart. The chart's
          # API versions (autoscaling/v2, policy/v1, discovery.k8s.io/v1) are
          # what the node image has to satisfy; the client is pinned to match
          # the server rather than the calendar.
          version: v0.31.0
          kubectl_version: v1.31.4
          node_image: kindest/node:v1.31.2

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      # Render drift, image builds, and the Compose model.
      - name: Deployment gate
        run: deno task check:deploy

      # The real proof: apply the COMMITTED manifests to the cluster, wait for
      # a rollout (which only completes if the readiness probe passes), serve a
      # request through the Service, and verify the discovery RBAC.
      #
      # kind-action already created the cluster, so the gate reuses it.
      # KEEP_CLUSTER stops the gate deleting a cluster the action owns.
      - name: Cluster end-to-end
        run: deno task check:deploy --cluster
        env:
          KEEP_CLUSTER: '1'

  publish-dry-run:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: JSR publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Resolves third-party code: `publish:check` type-checks every package,
          # which fetches the whole graph. The only git here is `git ls-files`
          # inside the version sweep — a local read.
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      # Validates every workspace package against JSR's publish rules without
      # publishing: exports resolve, package metadata is complete, and the
      # public API is free of "slow types". Slow types block JSR's automatic
      # .d.ts generation, which is precisely what the Node and Bun compat jobs
      # below will consume — so this job is the upstream gate for both.
      #
      # No --allow-dirty: a fresh checkout is clean, and a dirty tree here
      # would mean a previous step mutated the working copy.
      - name: Publish dry-run
        run: deno task publish:check

      # `publish:check` cannot see the four things `release:verify` exists for:
      # version agreement across all 47 manifests, cross-package specifier
      # resolvability, that both release lists cover the whole workspace, and
      # `@module`-first entrypoints. Until now it ran ONLY on a tag — that is,
      # after a release PR had already been merged — so a release branch could
      # be accepted with none of them checked. The version is read from the
      # workspace rather than written here, so this step needs no per-release
      # edit and cannot drift from what is being shipped.
      - name: Release consistency
        run: deno task release:verify "$(jq -r .version packages/kernel/deno.json)"

      # The sites release:verify cannot see. It reads manifests; this reads the
      # `src` trees and lockfiles, where a stale `@setu-ts` specifier still
      # RESOLVES — so it survives deno check, the suite, publish:check and
      # release:verify, and publishes a package depending on the previous
      # release. Measured, not assumed: reverting one packages/sdk/src
      # specifier leaves all of those green.
      - name: Sweep for residual version references
        run: deno task check:versions

  # These two jobs consume the packages through JSR's npm compatibility layer
  # and run `compat/compat.test.mjs` (AI_GUIDELINES.md §4.5). They cannot run
  # against the working tree: cross-package specifiers are
  # `jsr:@setu-ts/*` and optional heavy deps are `npm:*`, neither of
  # which Node or Bun resolves. JSR rewrites both at publish time, so the
  # published artifact is the unit under test.
  #
  # `compat/package.json` therefore depends on `latest` rather than on the
  # workspace's own version: during a release the workspace is bumped BEFORE
  # the publish, so pinning to it would deadlock the release PR against the
  # publish that would fix it (the M34b drift-gate lesson). The consequence is
  # deliberate and worth stating — these jobs gate the last release, not HEAD.
  # `node-compat` and `bun-compat` live in `.github/workflows/compat.yml`. They
  # install the PUBLISHED packages from JSR's npm mirror, so nothing a pull
  # request changes can affect them until it has been released — running them
  # here cost two installs and two suites per push while proving nothing about
  # the diff. They now run weekly, on demand, and on a change to `compat/`.

  # Node and Bun consume JSR's npm-compatible artifacts. This job separately
  # proves that a fresh Deno consumer can resolve and import the JSR package
  # added to the compatibility suite, including its transitive `jsr:` graph.
  deno-view-plugin-resolution:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Deno view-plugin resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The strongest case in this workflow, and the same one the two compat
          # jobs document: it resolves a package from a public registry and then
          # dynamically IMPORTS it, so third-party code executes here. It runs no
          # git command at all.
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      - name: Resolve and import from a clean Deno project
        run: |
          temporary="$(mktemp -d)"
          cd "$temporary"
          deno init --quiet
          deno add --minimum-dependency-age=0 jsr:@setu-ts/view-plugin
          deno eval --allow-read --config deno.json '
            const config = JSON.parse(await Deno.readTextFile("deno.json"));
            const specifier = config.imports?.["@setu-ts/view-plugin"];
            if (typeof specifier !== "string" || !specifier.startsWith("jsr:@setu-ts/view-plugin@")) {
              throw new Error("deno add did not record the view-plugin JSR dependency");
            }
            const lock = JSON.parse(await Deno.readTextFile("deno.lock"));
            if (!Object.keys(lock.jsr ?? {}).some((key) => key.startsWith("@setu-ts/view-plugin@"))) {
              throw new Error("deno add did not lock the view-plugin JSR dependency");
            }
            await import("@setu-ts/view-plugin");
          '

  audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Does NOT execute third-party code — it reads `deno.lock` and queries
          # the advisory endpoints — but it needs no credential either, so the
          # default persistence is a credential in reach for no benefit. It runs
          # no git command at all.
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      # Native dependency audit (JSR + npm deps in deno.lock).
      # OSV-Scanner is not used: it has no deno.lock support.
      #
      # `audit:ci`, not `audit`: the npm advisory endpoint flakes, and a bare
      # `deno audit` then fails having scanned nothing. The wrapper retries a
      # REGISTRY failure and fails immediately on a real advisory — and still
      # fails if every attempt is a registry failure, because "could not scan"
      # is not "no vulnerabilities". See scripts/audit.ts for why
      # `--ignore-registry-errors` is deliberately not used.
      - name: Audit
        run: deno task audit:ci
