name: Website

# The public website is an isolated pnpm project under website/ (outside the root
# pnpm workspace, with its own lockfile). This workflow adds ONLY website-justified checks; every existing job in
# ci.yml / release.yml / drift.yml is untouched and keeps its meaning.
on:
  push:
    branches: [main, develop]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'assets/**'
      - 'scripts/generate-api-docs.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'assets/**'
      - 'scripts/generate-api-docs.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/website.yml'

permissions:
  contents: read

jobs:
  build:
    # Website builds are expensive enough to reserve for repository branches. Fork PRs can still be
    # reviewed as diffs, then validated from a trusted branch after maintainer triage.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Build / links / accessibility / performance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          # Executes third-party code: `pnpm install` installs the root and the
          # site's npm graphs, the Astro and Pagefind CLIs then run under it, and the
          # Lighthouse step fetches and runs a CLI with `npx -y`. It runs no git
          # command at all.
          persist-credentials: false

      # Node 24 runs the TypeDoc API reference, Astro, Pagefind and Lighthouse CI; it meets
      # the website package's Node >=22 requirement.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      # The API reference is generated by the repository's own TypeDoc install, so the
      # root graph is installed first.
      - name: Install repository dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # A fresh GitHub checkout has no node_modules, so this and the following build
      # validate the same clean dependency-install and resolver path Cloudflare uses.
      - name: Install site dependencies
        run: pnpm install --frozen-lockfile

      # The website build regenerates API docs from HEAD before Astro validates the
      # rewritten documentation-link graph and grafts the generated reference.
      - name: Build site
        run: pnpm run build

      - name: Link-rewriting unit tests
        run: pnpm run test

      # Formatting and linting come from the root Prettier and ESLint configs.
      - name: Website formatting and linting
        working-directory: .
        run: pnpm exec prettier --check website && pnpm exec eslint website

      - name: Lighthouse (accessibility + performance budgets)
        run: npx -y @lhci/cli@0.14.0 autorun
