name: Dependency drift

on:
  schedule:
    # Weekly: upstream releases become visible during their first full week.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fresh-resolution:
    name: Fresh resolution and gates
    runs-on: ubuntu-latest
    # Drift is diagnostic: it must never block ordinary pull requests or a
    # release, but it must remain visibly red when a fresh graph is unhealthy.
    continue-on-error: true
    # The same backend environment as the `node` job in ci.yml, because the
    # gates below re-run that job's suite and it is not the same suite without
    # them. Two things went wrong while this job started none of them. The
    # visible one: GitHub sets CI=true in EVERY workflow, so
    # `test/apps-gate.test.ts` asserts REDIS_URL is reachable here exactly as
    # it does on a pull request — that assertion was the entire `test` failure
    # this job reported on 2026-09-07 and 2026-09-14, and it is not dependency
    # drift. The invisible one matters more: every guarded real-backend suite
    # skipped here (6 suites, 70 steps), and those are precisely the suites a
    # drifted ioredis, amqplib, kafkajs, mongodb or AWS SDK would break — so
    # the job under-reported the very thing it exists to find. Kept in step
    # with ci.yml by the derived parity test in
    # `test/unit/release-notes.test.ts`, which reads what this job must declare
    # out of ci.yml rather than from a hand-written list.
    env:
      # Includes guarded messaging Redis Streams restart/redelivery tests.
      REDIS_URL: redis://localhost:6379
      SQS_ENDPOINT_URL: http://localhost:9324
      SQS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # M70c §3.7 real-outage suites: a real broker/backend, really stopped.
      # Guarded on these env vars and NOT in ALLOW_SKIP, so a dropped service
      # or a missing var fails the job instead of quietly skipping.
      RABBITMQ_URL: amqp://localhost:5672
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: m70c-verify
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      SMTP_URL: smtp://localhost:1025
      MONGODB_URI: mongodb://127.0.0.1:27017
      # M80 §6.2: the real-emulator DynamoDB suite (database-plugin) guards on
      # this exact endpoint, which is also the host:port the package manifest's
      # net grant scopes.
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
      # M109b within-real uses this separate guard for the same emulator.
      DYNAMODB_ENDPOINT_URL: http://127.0.0.1:8000
      # M82 §3.13: the real-emulator Bigtable suite (database-plugin) guards on
      # this exact endpoint, which is also the host:port the package manifest's
      # net grant scopes. `127.0.0.1` rather than `localhost` deliberately: the
      # SDK speaks gRPC, and a `host:port` grant does not authorize a DNS
      # lookup, so an IP literal is what keeps the grant endpoint-scoped (the
      # M70g Pub/Sub lesson).
      BIGTABLE_EMULATOR_ENDPOINT: 127.0.0.1:8086
      # M100b §6: the real-provider Keycloak suite (auth-plugin) guards on this
      # exact base URL, which is also the host:port the manifest's net grant scopes.
      KEYCLOAK_URL: http://localhost:8180
      # M90d §3.5: the real-backend NATS and Kafka suites (messaging-plugin)
      # guard on these exact endpoints, which are also the host:port pairs the
      # package manifest's net grant scopes. Started by the steps below.
      NATS_URL: nats://127.0.0.1:4222
      KAFKA_BROKERS: 127.0.0.1:9092
      # M107 §6 (C8): the outbox real-backend suites (messaging-plugin) guard on
      # these. `OUTBOX_POSTGRES_URL` is a DISTINCT variable from the bare one
      # so the database-plugin live-Postgres cells (which need a generated Prisma
      # client) keep ignoring here. Port 5433, not 5432: it is the port
      # database-plugin's net grant already names, and the one the local
      # backend runs on. `MONGODB_RS_URI` is a single-node REPLICA SET on its own
      # port — the `mongo` service below is standalone, and a standalone server
      # refuses transactions, which the outbox needs.
      OUTBOX_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5433/postgres
      MONGODB_RS_URI: mongodb://127.0.0.1:27018/?replicaSet=rs0&directConnection=true
    services:
      # M107 §6 (C8): PostgreSQL for the outbox real-backend suites, on host port
      # 5433 (see OUTBOX_POSTGRES_URL above).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mongo:
        # mongo:7, not 8: MongoDB 8.0+ crashes on Linux 6.19+ (its TCMalloc breaks the
        # kernel's rseq ABI; SERVER-121912, no fixed release named), and the runner
        # images moved to kernel 7.0 on 2026-10-18. Return to mongo:8 once a fixed
        # MongoDB release exists.
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticmq:
        image: softwaremill/elasticmq-native:1.7.1
        ports:
          - 9324:9324
        # The image ships neither curl nor a 2xx-answering root path — ElasticMQ
        # returns 400 to a bare GET / — so an HTTP probe can never pass. `nc` is
        # present and a port check is what readiness actually means here.
        options: >-
          --health-cmd "nc -z localhost 9324 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # M70c §3.7: the RabbitMQ outage suites (messaging broker + queue) need a
      # real broker to stop and restart. Higher retries than the other services:
      # the Erlang VM needs a few seconds before `rabbitmq-diagnostics ping`
      # answers, and the outage test stops/restarts the container, so the
      # service must be healthy before the first test runs.
      rabbitmq:
        # Major version 4 is load-bearing (M70l X10-1): 3.13 accepts the queue
        # declaration the broker used to emit, so the defect is invisible there.
        image: rabbitmq:4-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      # M70c §3.7: the S3 outage suite (storage-plugin) needs a real
      # S3-compatible gateway. The bucket is created by the test itself
      # (ensureBucket), so the service starts with an empty data dir.
      # M70c §3.7: the SMTP outage suite (mail-plugin) needs a real SMTP
      # server. Only the SMTP port is published; readiness uses Mailpit's own
      # `readyz` subcommand because the image ships neither curl nor a
      # `/health` route (verified: `/health` 404s, `/readyz` answers 200).
      mailpit:
        image: axllent/mailpit:v1.20.4
        ports:
          - 1025:1025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # M80 §6.2: the real-emulator DynamoDB suite (database-plugin) needs the
      # emulator. A bare GET / answers 400, so a naive `curl -f /` could never
      # pass — but curl IS in the image, and a POST ListTables answers 200 once
      # the emulator is ready (M80 §1A E3, measured). Like ElasticMQ above,
      # the probe has to match what readiness actually means here.
      # DynamoDB Local answers a bare `GET /` with 400, so a naive `curl -f /`
      # healthcheck can never pass (the ElasticMQ situation above). A POST
      # ListTables does answer 200 — but ONLY with an `Authorization` header:
      # without one the server replies 400 and `curl -f` exits 22, which is how
      # this check first shipped and left the container permanently unhealthy.
      # The credential is inert (DynamoDB Local never validates it); it is the
      # header's PRESENCE that makes the request well-formed.
      dynamodb:
        # Pinned to a version rather than `latest`: every other service in
        # this workflow pins at least a major (mongo:7, redis:7, rabbitmq:4),
        # and a floating tag can change the emulator's behaviour between runs.
        # A sha256 digest is deliberately not used — no other service here is
        # digest-pinned, and the asymmetry would be the surprising part.
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -sf -X POST -H 'X-Amz-Target: DynamoDB_20120810.ListTables' -H 'Content-Type: application/x-amz-json-1.0' -H 'Authorization: AWS4-HMAC-SHA256 Credential=ci/20260101/us-east-1/dynamodb/aws4_request' -d '{}' http://localhost:8000/"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The most exposed checkout in this repository, and the reason the
          # credential audit (issue #340) did not stop at ci.yml. This job
          # deliberately resolves EVERY range fresh (the committed lock is removed)
          # and then runs the whole suite against whatever upstream published
          # this week — unreviewed third-party code, by design. It needs no git
          # credential: every git command it runs is a LOCAL read (the suite's
          # `git describe`/`git log` below), and
          # the issue-filing step gets its token explicitly through GH_TOKEN
          # rather than from the git config.
          persist-credentials: false
          # The suite runs `release:verify`, whose check 9 lists the pull
          # requests merged since the previous `v*` tag. A shallow checkout has
          # no tag, so that check refused with "No release tag is reachable" and
          # filed issue #413 as dependency drift when nothing had drifted. ci.yml
          # and release.yml already fetch full history for the same check;
          # `test/unit/release-notes.test.ts` now asserts every suite consumer
          # does. The fetch happens during checkout, while the credential is
          # still held, so dropping it above costs nothing here.
          fetch-depth: 0
          # Every run, scheduled or manual, tests `develop`: drift is a question
          # about what is being built next. Without this ref a scheduled run
          # would check out the default branch, `main`, which holds only the last
          # release; that is how issue #507 reported a test race develop had
          # already fixed (6c299f67).
          ref: develop

      # Deno is a subject here, as in ci.yml: the SDK fixtures' `deno fmt`, the
      # CLI e2e suites' Deno-target scaffolds, and the Deno runtime lane.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      # The CLI e2e suites scaffold and run Bun projects (M114), as in ci.yml.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Every gate below must see this week's resolution: installing the committed
      # pnpm-lock.yaml would test the locked versions and report a drifted ioredis,
      # amqplib, kafkajs, mongodb or AWS SDK as a green `test` row. The committed
      # lock is kept for the report's comparison, then removed so pnpm resolves
      # every declared range fresh (`--lockfile-only`), and the fresh lock is then
      # installed frozen, so the gates run against exactly the graph the report
      # describes. It carries continue-on-error so a failed resolution reaches the
      # report instead of skipping it. The Deno runtime lane keeps its own committed
      # test/deno-lane/deno.lock: its JSR graph is not part of this resolution.
      - name: Resolve every declared range fresh
        id: resolve
        continue-on-error: true
        run: |
          cp pnpm-lock.yaml "$RUNNER_TEMP/pnpm-lock.committed.yaml"
          rm pnpm-lock.yaml
          if ! pnpm install --lockfile-only; then
            echo "::error title=Dependency range resolution failed::pnpm install --lockfile-only"
            exit 1
          fi
          pnpm install --frozen-lockfile

      # M100b §6: the real-provider Keycloak suite (auth-plugin) guards on
      # KEYCLOAK_URL. A step rather than a `services:` container because the
      # realm is imported at startup — `start-dev --import-realm` is a COMMAND
      # and the realm file is a volume, neither of which a service block can
      # set. Readiness is the realm's own discovery document, which is exactly
      # what the suite reads first.
      - name: Start Keycloak (outside-issuer suite)
        continue-on-error: true
        run: |
          docker run -d --name keycloak -p 127.0.0.1:8180:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$GITHUB_WORKSPACE/packages/auth-plugin/test/fixtures/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.4 start-dev --import-realm
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8180/realms/setu/.well-known/openid-configuration >/dev/null; then
              echo 'keycloak ready'
              exit 0
            fi
            sleep 2
          done
          echo 'keycloak did not become ready'
          docker logs keycloak
          exit 1

      # The backends that cannot be `services:` containers, because each
      # needs a command or an argument and `options` reaches `docker create`
      # BEFORE the image while the command comes after it. ci.yml carries the
      # reasoning per backend; these are byte-identical to its steps, which the
      # parity test compares, except for the `continue-on-error: true` each
      # carries here. That one line is load-bearing for THIS job: its whole
      # output is a report, and without it a single failed image pull skips
      # every backend step after it -- and the resolve step below, which
      # carries no `if:`, so the report would then blank the drift table
      # entirely and claim resolution had failed. `if: always()` has the same
      # defect for the same reason; only `continue-on-error` keeps the job
      # walking to its report.
      #
      # The cost, stated because it is real: a failed backend does NOT fail
      # this job. It surfaces as its own red step annotation in the run, and as
      # whichever guarded suites then fail in the `test` row. A reader who sees
      # `test: failure` has to open the run to tell a broken container from
      # broken dependencies -- worth a `backends` report row if it ever
      # actually bites.
      - name: Start the Cloud Bigtable emulator
        continue-on-error: true
        run: |
          docker run -d --name bigtable-emulator -p 127.0.0.1:8086:8086 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators bigtable start --host-port=0.0.0.0:8086
          for _ in $(seq 1 60); do
            if docker exec bigtable-emulator bash -c 'echo > /dev/tcp/127.0.0.1/8086' 2>/dev/null; then
              echo 'bigtable emulator ready'
              exit 0
            fi
            sleep 2
          done
          echo 'bigtable emulator did not become ready'
          docker logs bigtable-emulator
          exit 1

      - name: Start the NATS server (JetStream)
        continue-on-error: true
        run: |
          docker run -d --name m90d-nats -p 127.0.0.1:4222:4222 nats:2-alpine -js
          for _ in $(seq 1 60); do
            if docker exec m90d-nats nc -z 127.0.0.1 4222 2>/dev/null; then
              echo 'nats ready'
              exit 0
            fi
            sleep 2
          done
          echo 'nats server did not become ready'
          docker logs m90d-nats
          exit 1

      - name: Start Kafka (KRaft single-node)
        continue-on-error: true
        run: |
          docker run -d --name m90d-kafka -p 127.0.0.1:9092:9092 apache/kafka:4.0.0
          for _ in $(seq 1 90); do
            if docker exec m90d-kafka /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9092 > /dev/null 2>&1; then
              echo 'kafka ready'
              exit 0
            fi
            sleep 2
          done
          echo 'kafka did not become ready'
          docker logs m90d-kafka
          exit 1

      # M107 §6 (C8): a single-node MongoDB REPLICA SET for the outbox suites.
      # It cannot be the `mongo` service: `--replSet` is a command-line flag a
      # service block cannot pass (`options` reaches `docker create` before the
      # image), and that service must stay standalone, because the outbox's
      # startup refusal of a standalone server is itself under test. Its own
      # port, so both run side by side. Readiness means a PRIMARY exists, not an
      # open port: transactions are refused until the member is elected.
      - name: Start a MongoDB replica set (outbox suites)
        continue-on-error: true
        run: |
          docker run -d --name mongo-rs -p 127.0.0.1:27018:27018 mongo:7 \
            --replSet rs0 --port 27018 --bind_ip_all
          for _ in $(seq 1 60); do
            if docker exec mongo-rs mongosh --port 27018 --quiet \
              --eval 'db.runCommand({ ping: 1 }).ok' > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec mongo-rs mongosh --port 27018 --quiet --eval \
            "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27018' }] })"
          for _ in $(seq 1 60); do
            if docker exec mongo-rs mongosh --port 27018 --quiet \
              --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then
              echo 'mongodb replica set ready'
              exit 0
            fi
            sleep 2
          done
          echo 'mongodb replica set did not elect a primary'
          docker logs mongo-rs
          exit 1

      - name: Start MinIO (S3 storage outage suite)
        continue-on-error: true
        run: |
          docker run -d --name m70c-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1 server /data
          for _ in $(seq 1 60); do
            if curl -fs http://localhost:9000/minio/health/ready >/dev/null; then
              echo 'minio ready'
              exit 0
            fi
            sleep 2
          done
          echo 'minio did not become ready'
          docker logs m70c-minio
          exit 1

      # Every gate runs from the freshly resolved install, so a dependency drift
      # CAN change its result, and each needs that install to have succeeded:
      # without the resolve guard a failed resolution would report as a gate
      # failure. The fixture half of fmt:check is `deno fmt`, which reads no
      # lockfile.
      - name: Format check
        id: fmt
        if: always() && steps.resolve.outcome == 'success'
        continue-on-error: true
        run: pnpm run fmt:check

      - name: Lint
        id: lint
        if: always() && steps.resolve.outcome == 'success'
        continue-on-error: true
        run: pnpm run lint

      - name: Type check against fresh resolution
        id: check
        if: always() && steps.resolve.outcome == 'success'
        continue-on-error: true
        run: pnpm run check

      - name: Test against fresh resolution
        id: test
        if: always() && steps.resolve.outcome == 'success'
        continue-on-error: true
        run: |
          node scripts/codemods/std-to-vitest.ts --check
          pnpm test:coverage
          pnpm run test:deno-lane
          pnpm run test:tooling:coverage

      - name: Attribute drift and summarize gates
        id: report
        if: always()
        env:
          RESOLUTION_OUTCOME: ${{ steps.resolve.outcome }}
          FORMAT_OUTCOME: ${{ steps.fmt.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          report="$RUNNER_TEMP/dependency-drift.md"
          if [ "$RESOLUTION_OUTCOME" = success ]; then
            pnpm --silent run dependency:drift "$RUNNER_TEMP/pnpm-lock.committed.yaml" \
              pnpm-lock.yaml > "$report"
          else
            printf '%s\n' '## Dependency drift' '' \
              'Fresh resolution failed before the gates could run. The resolve step emits an error annotation.' > "$report"
          fi
          printf '%s\n' '' '## Fresh-resolution gates' '' \
            '| Gate | Result |' '| --- | --- |' \
            "| resolve | $RESOLUTION_OUTCOME |" \
            "| fmt | $FORMAT_OUTCOME |" \
            "| lint | $LINT_OUTCOME |" \
            "| check | $CHECK_OUTCOME |" \
            "| test | $TEST_OUTCOME |" >> "$report"
          if grep -q '^| `' "$report" || [ "$RESOLUTION_OUTCOME" != success ] || \
            [ "$FORMAT_OUTCOME" = failure ] || [ "$LINT_OUTCOME" = failure ] || \
            [ "$CHECK_OUTCOME" = failure ] || [ "$TEST_OUTCOME" = failure ]; then
            echo 'action_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'action_required=false' >> "$GITHUB_OUTPUT"
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update dependency-drift issue
        if: always() && steps.report.outputs.action_required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create dependency-drift --color B60205 --description 'Fresh dependency resolution changed or failed' --force
          issue=$(gh issue list --label dependency-drift --state open --limit 1 --json number --jq '.[0].number')
          if [ -z "$issue" ]; then
            gh issue create --title 'Dependency drift detected' --label dependency-drift \
              --body-file "$RUNNER_TEMP/dependency-drift.md"
          else
            gh issue edit "$issue" --body-file "$RUNNER_TEMP/dependency-drift.md"
          fi

      - name: Mark dependency drift as detected
        if: always() && steps.report.outputs.action_required == 'true'
        run: exit 1
