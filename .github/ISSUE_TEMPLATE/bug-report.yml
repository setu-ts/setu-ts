name: Bug report
description: Report a reproducible problem in a published Setu-TS package.
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include credentials, private endpoints, customer
        data, or security-sensitive details. Use the private security-reporting route instead for a
        vulnerability.
  - type: input
    id: summary
    attributes:
      label: What happened?
      description: State the observable failure in one sentence.
      placeholder: Calling X returns Y instead of Z.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Setu-TS version
      description: Include every affected @setu-ts package and version.
      placeholder: '@setu-ts/kernel@0.6.0, @setu-ts/auth-plugin@0.6.0'
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Deno
        - Bun
        - Cloudflare Workers
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest safe code sample and commands that reproduce the problem.
      placeholder: |
        1. Install ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and safe logs
      description: Remove secrets and personal data before posting.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions and removed sensitive information.
          required: true
