name: Documentation problem
description: Report incorrect, missing, or unclear documentation.
title: '[Docs]: '
labels: ['documentation']
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link the page and heading, or name the README and section.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Suggested correction
      description: Explain the behaviour the documentation should describe. A pull request is welcome
        once the correction is clear.
    validations:
      required: true
