name: Runtime compatibility report
description: Report a problem specific to Node.js, Deno, Bun, or Cloudflare Workers.
title: '[Compatibility]: '
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a failure that depends on a supported runtime. For a security issue, use
        private vulnerability reporting instead.
  - type: input
    id: package
    attributes:
      label: Affected package and version
      placeholder: '@setu-ts/runtime@0.6.0'
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Deno
        - Bun
        - Cloudflare Workers
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      placeholder: Node.js 24.18.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include install and execution steps, with all secrets removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and safe logs
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I tested the current published version and removed sensitive information.
          required: true
