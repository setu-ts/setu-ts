# Generated by `setu`. Run: npm run proto:gen
#
# `proto:gen` runs buf through `npx -p`, which puts protoc-gen-es (pinned to the
# locked @bufbuild/protobuf) on PATH, so buf finds the plugin by name. A remote plugin (`remote: buf.build/bufbuild/es`)
# would also work and is deliberately not used: it uploads this schema to a
# registry to compile it.
version: v2
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-es
    out: src/gen
    opt: target=ts
