# Dev-only workspace edges are cyclic (test-only imports, plan §3.1); each
# member's build is `tsc -b`, which orders its own references.
ignoreWorkspaceCycles: true

# @azure/identity still requests msal-node 6; 7.1 fixes GHSA-xcx6-jx8p-x3h5.
overrides:
  '@azure/msal-node': ^7.1.0

# Google SDK install scripts are denied: both are transitive deps of
# the Google Cloud SDKs the tests reach only through fakes and guarded
# suites. pnpm 12 refuses a frozen install while either is undecided.
allowBuilds:
  # Swagger UI assets need no install-time analytics hook.
  '@scarf/scarf': false
  protobufjs: false
  sse4_crc32: false
  # The TC39 decorator transformer requires its native build.
  esbuild: true
