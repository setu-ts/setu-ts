{{- if .Values.secrets }}
{{/*
A convenience for local clusters so the chart is self-contained. For anything real, prefer an
external secret manager — the framework ships SecretsPlugin with AWS Secrets Manager, GCP Secret
Manager, Azure Key Vault and HashiCorp Vault providers — because values passed through
`--set secrets.X=...` land in Helm release history in plaintext.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "setu-ts.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "setu-ts.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
