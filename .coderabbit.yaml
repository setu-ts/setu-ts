# CodeRabbit never reviews a pull request on its own. Every review is requested with an
# `@coderabbitai review` comment, which the agent or maintainer opening a non-`docs/…` PR posts
# once the PR's head is final — after the last push that follows `gh pr create` — because a push
# while a review runs aborts it ("Head commit changed") with no retry (AI_GUIDELINES §16.7). `docs/…` PRs are deliberately left
# unreviewed: the review is for code.
#
# Why manual: `main` is the repository's default branch, while every milestone, fix and docs PR
# targets `develop`. CodeRabbit's automatic review covers the default branch plus `base_branches`,
# so automatic review would have to be re-scoped to `develop` and would then also fire on `docs/…`
# PRs, which no setting here can exclude by HEAD branch. A comment trigger is both explicit and
# excludable.
reviews:
  # Suppress the bot's "review skipped" status comment, which would otherwise appear on every PR now
  # that automatic review is off.
  review_status: false
  auto_review:
    # Off, with no positive `labels` entry and no `description_keyword`: either of those would opt
    # a PR back in while `enabled` is false.
    enabled: false
    # Irrelevant while `enabled` is false; kept explicit so re-enabling does not silently turn on
    # re-review of every push. A re-review is requested with another `@coderabbitai review`.
    auto_incremental_review: false
